<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blog.title}">Умения+</title>

    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/content.css">
    <link rel="stylesheet" href="/api/style/buttons.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">

    <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/api/js/loadUserInfo.js" defer></script>
    <script src="/api/js/applyTheme.js" defer></script>
    <style>
        .flame-badge {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(45deg, #ff4500, #ff8c00);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9999;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0) translateY(100px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .flame-icon {
            font-size: 1.2rem;
        }
    </style>

</head>
<body>

<header>
    <div class="header-container" id="header-container">
        <a href="/" class="logo">Умения+</a>
        <a href="/home" class="btn-back">← Обратно</a>
    </div>
</header>

<main class="article-container">
    <span class="post-tag" th:text="${blog.tag}">Категория</span>

    <h1 class="post-title" th:text="${blog.title}">Заглавието на поста</h1>

    <div class="post-meta">
        от  <a id="author-profile" href="/user/" style="text-decoration: none">
        <span class="post-author" id="post-author" th:text="${blog.creator}">Автор</span>
            </a>
        <span class="meta-divider">•</span>
        <span id="post-date" class="post-date" th:data-date="${blog.creationDate}">
        </span>
    </div>

    <div id="admin-controls" style="display: none; margin-bottom: 20px;">
        <button onclick="editPost()" class="btn-edit">Редактирай</button>
        <button onclick="deletePost()" class="btn-delete">Изтрий</button>
    </div>

    <p class="post-excerpt" th:text="${blog.excerpt}">Това е кратко описание на
        съдържанието, целящо да грабне вниманието на читателя</p>
    <hr>

    <article id="post" class="content"></article>

</main>

<script>
    async function loadPost(id) {
        const res = await fetch(`/api/blog/${id}`);
        const markdown = await res.text();

        marked.setOptions({
            highlight: function (code, lang) {
                return hljs.highlightAuto(code).value;
            }
        });

        const rawHtml = marked.parse(markdown);

        const cleanHtml = DOMPurify.sanitize(rawHtml);

        document.getElementById("post").innerHTML = cleanHtml;
    }

    const pathParts = window.location.pathname.split("/");
    const postId = pathParts[pathParts.length - 1];

    async function canEdit() {
        const response = await fetch(`/api/blog/can-edit/${postId}`);

        if (response.ok) {
            document.getElementById("admin-controls").style.display = "block";
        }
    }

    async function deletePost() {
        const result = await Swal.fire({
            title: 'Сигурен ли си?',
            text: "Това действие е необратимо!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Да, изтрий!',
            cancelButtonText: 'Отказ'
        });

        if (!result.isConfirmed) return;

        const pathParts = window.location.pathname.split("/");
        const postId = pathParts[pathParts.length - 1];

        try {
            const response = await fetch(`/api/blog/${postId}`, {
                method: 'DELETE'
            });

            const data = await response.json();

            if (response.ok && data.status === "ok") {
                await Swal.fire({
                    icon: 'success',
                    title: 'Успешно!',
                    text: 'Публикацията е изтрита!',
                    confirmButtonColor: '#3085d6'
                });

                window.location.href = "/home";
            } else {
                throw new Error(data.message || "Deletion failed");
            }
        } catch (err) {
            console.error("Delete error:", err);
            Swal.fire({
                icon: 'error',
                title: 'Грешка!',
                text: 'Случи се случка, опитай отново!',
                confirmButtonColor: '#3085d6'
            });
        }
    }

    function editPost() {
        window.location.href = `/edit/${postId}`;
    }

    loadPost(postId);
    canEdit();

    function formatPostDate() {
        const dateElement = document.getElementById("post-date");
        const rawDate = dateElement.getAttribute("data-date");

        if (rawDate) {
            const date = new Date(rawDate);

            const formattedDate = date.toLocaleDateString('bg-BG', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            dateElement.innerText = formattedDate;
        }

        link();
    }

    function link() {
        const authorLink = document.getElementById("author-profile");
        const authorNameElement = document.getElementById("post-author");

        const username = authorNameElement.innerText;

        if (username) {
            authorLink.href = `/user/${username}`;
        }
    }

    formatPostDate();

    let timer = false;
    let rewardClaimed = false;

    setTimeout(() => {
        timer = true;
        checkRewardConditions();
    }, 15000);

    window.addEventListener('scroll', () => {
        checkRewardConditions();
    });

    async function checkRewardConditions() {
        if (rewardClaimed || !timer) return;

        const isAtBottom = (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 10);

        if (isAtBottom) {
            rewardClaimed = true;
            await claimReadingReward();
        }
    }

    async function claimReadingReward() {
        const authorName = document.getElementById("post-author").innerText;

        const currentUsername = typeof getUsername === 'function' ? getUsername() : null;

        const urlSegments = window.location.pathname.split("/").filter(Boolean);
        const blogId = urlSegments.pop();

        console.log("blogId", blogId);
        console.log("authorName", authorName);
        console.log("currentUsername", currentUsername);

        const payload = {
            author: authorName,
            user: currentUsername,
            page: blogId
        };

        try {
            const response = await fetch(`/api/blog/read`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const data = await response.json();
                showFlameUI(data.reward || 5);
            } else if (response.status === 406) {
                console.log("Тази публикация вече е прочетена.");
            }
        } catch (err) {
            console.error("Грешка при изпращане на наградата:", err);
        }
    }

    function showFlameUI(amount) {
        const badge = document.createElement('div');
        badge.className = 'flame-badge';
        badge.innerHTML = `
        <span class="flame-icon">🔥</span>
        <span>+${amount} Искри</span>
    `;

        document.body.appendChild(badge);

        addVisualFlames(amount);

        setTimeout(() => {
            badge.style.transition = "opacity 1s";
            badge.style.opacity = "0";
            setTimeout(() => badge.remove(), 1000);
        }, 10000);
    }

    console.log(postId);

</script>

</body>
</html>

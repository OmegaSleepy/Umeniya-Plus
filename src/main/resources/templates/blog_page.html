<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blog.title}">Умения+</title>

    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/content.css">
    <link rel="stylesheet" href="/api/style/buttons.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/api/js/loadUserInfo.js" defer></script>
    <script src="/api/js/applyTheme.js" defer></script>

    <style>
        .flame-badge {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(45deg, #ff4500, #ff8c00);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9999;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: scale(0) translateY(100px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .post-stats {
            display: inline-flex;
            gap: 15px;
            margin-left: 15px;
            color: #888;
            font-size: 0.9rem;
        }

        .like-section {
            margin-top: 40px;
            padding: 20px 0;
            border-top: 1px solid #eee;
            text-align: center;
        }


    </style>
</head>
<body>

<header>
    <div class="header-container" id="header-container">
        <a href="/" class="logo">Умения+</a>
        <a href="/home" class="btn-back">← Обратно</a>
    </div>
</header>

<main class="article-container">
    <span class="post-tag" th:text="${blog.tag}">Категория</span>

    <h1 class="post-title" th:text="${blog.title}">Заглавието на поста</h1>

    <div class="post-meta">
        от <a id="author-profile" href="/user/" style="text-decoration: none">
        <span class="post-author" id="post-author" th:text="${blog.creator}">Автор</span>
    </a>
        <span class="meta-divider">•</span>
        <span id="post-date" class="post-date" th:data-date="${blog.creationDate}"></span>

        <div class="post-stats">
            <span>👁️ <span th:text="${blog.views}">0</span></span>
            <span>💚️ <span id="likes-count" th:text="${blog.likes}">0</span></span>
        </div>
    </div>

    <div id="admin-controls" style="display: none; margin-bottom: 20px;">
        <button onclick="editPost()" class="btn-edit">Редактирай</button>
        <button onclick="deletePost()" class="btn-delete">Изтрий</button>
    </div>

    <p class="post-excerpt" th:text="${blog.excerpt}">Кратко описание...</p>
    <hr>

    <article id="post" class="content"></article>

    <div class="like-section">
        <button id="like-btn" onclick="likePost()" class="btn-like">
            💚 Харесай
        </button>
    </div>

</main>

<script>
    const pathParts = window.location.pathname.split("/");
    const postId = pathParts[pathParts.length - 1];

    async function loadPost(id) {
        const res = await fetch(`/api/blog/${id}`);
        const markdown = await res.text();

        marked.setOptions({
            highlight: function (code, lang) {
                return hljs.highlightAuto(code).value;
            }
        });

        const rawHtml = marked.parse(markdown);

        const cleanHtml = DOMPurify.sanitize(rawHtml);

        document.getElementById("post").innerHTML = cleanHtml;
    }

    async function deletePost() {
        if (!confirm("Сигурен ли си?")) return;

        try {
            const response = await fetch(`/api/blog/delete/${postId}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (response.ok && result.status === "ok") {
                Swal.fire({
                    icon: 'success',
                    title: 'Упешно!',
                    text: 'Публикацията е изтрита!',
                    confirmButtonColor: '#3085d6'
                });
                window.location.href = "/home";
            } else {
                console.error("Сървърът отказа триене:", result);
                Swal.fire({
                    icon: 'warning',
                    title: 'Грешка!',
                    text: 'Случи се случка, опитай отново!',
                    confirmButtonColor: '#3085d6'
                });
            }
        } catch (err) {
            console.error("Fatal error:", err);
        }
    }

    function editPost() {
        window.location.href = `/edit/${postId}`;
    }

    async function likePost() {
        // Check if getUsername exists, otherwise default to null/anonymous
        const currentUsername = typeof getUsername === 'function' ? getUsername() : null;
        const btn = document.getElementById("like-btn");

        try {
            const response = await fetch(`/api/blog/like`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: currentUsername,
                    page: postId
                })
            });

            const data = await response.json();

            if (response.ok) {
                const likesElement = document.getElementById("likes-count");
                const currentLikes = parseInt(likesElement.innerText) || 0;
                likesElement.innerText = currentLikes + 1;
                btn.innerHTML = "💚 Харесано";
                btn.disabled = true;

                Swal.fire({
                    icon: 'success',
                    title: 'Благодарим!',
                    text: 'Твоето харесване беше отчетено.',
                    timer: 2000,
                    showConfirmButton: false
                });
            } else if // 1. Handle Unauthenticated (403)
            (response.status === 403) {
                Swal.fire({
                    title: 'Не си влязъл в профила си',
                    text: "Трябва да влезеш, за да харесаш тази публикация.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#aaa',
                    confirmButtonText: 'Към вход',
                    cancelButtonText: 'Отказ'
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = "/login";
                    }
                });
                return;
            } else {
                // Server error (e.g., 400 Bad Request or 409 Conflict)
                Swal.fire({
                    icon: 'info',
                    title: 'Опа!',
                    text: data.error || 'Възникна грешка.',
                    confirmButtonColor: '#3085d6'
                });

                if (data.error && data.error.includes("харесал")) {
                    btn.classList.add("liked");
                    btn.innerHTML = "💚 Вече харесано";
                    btn.disabled = true;
                }
            }
        } catch (err) {
            console.error("Network error:", err);
            Swal.fire({
                icon: 'error',
                title: 'Грешка в мрежата',
                text: 'Неуспешно свързване със сървъра.',
                confirmButtonColor: '#d33'
            });
        }
    }

    async function canEdit() {
        const response = await fetch(`/api/blog/can-edit/${postId}`);
        if (response.ok) document.getElementById("admin-controls").style.display = "block";
    }

    function formatPostDate() {
        const dateElement = document.getElementById("post-date");
        const rawDate = dateElement.getAttribute("data-date");
        if (rawDate) {
            dateElement.innerText = new Date(rawDate).toLocaleDateString('bg-BG', {
                day: 'numeric', month: 'long', year: 'numeric'
            });
        }
        const username = document.getElementById("post-author").innerText;
        if (username) document.getElementById("author-profile").href = `/user/${username}`;
    }

    loadPost(postId);
    canEdit();
    formatPostDate();

    // Reward Logic...
    let timer = false;
    let rewardClaimed = false;
    setTimeout(() => {
        timer = true;
    }, 1500);
    window.addEventListener('scroll', async () => {
        if (rewardClaimed || !timer) return;
        if ((window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 50)) {
            rewardClaimed = true;
            claimReadingReward();
        }
    });

    async function claimReadingReward() {
        const currentUsername = typeof getUsername === 'function' ? getUsername() : null;
        const payload = {author: document.getElementById("post-author").innerText, user: currentUsername, page: postId};
        try {
            const res = await fetch(`/api/blog/read`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                const data = await res.json();
                showFlameUI(data.reward || 5);
            }
        } catch (err) {
            console.error(err);
        }
    }

    function showFlameUI(amount) {
        const badge = document.createElement('div');
        badge.className = 'flame-badge';
        badge.innerHTML = `<span class="flame-icon">🔥</span><span>+${amount} Искри</span>`;
        document.body.appendChild(badge);
        setTimeout(() => {
            badge.style.opacity = "0";
            setTimeout(() => badge.remove(), 1000);
        }, 5000);
    }
</script>
</body>
</html>

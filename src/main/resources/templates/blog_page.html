<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blog.title}">Умения+</title>

    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/content.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">

    <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.min.js"></script>
    <script src="/api/js/loadUserInfo.js" defer></script>

    <style>
        #admin-controls {
            display: flex;
            gap: 10px;
        }

        .btn-edit, .btn-delete {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-edit {
            background-color: #4CAF50;
            color: white;
        }

        .btn-edit:hover {
            background-color: #45a049;
        }

        .btn-delete {
            background-color: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background-color: #da190b;
        }
    </style>


</head>
<body>

<header>
    <div class="header-container" id="header-container">
        <a href="/" class="logo">Умения+</a>
        <a href="/home" class="btn-back">← Обратно</a>
        <div class="userInformation" style="display: flex">
            <label for="profile-icon" id="username" style="margin: 10px">
                Не сте вписани
            </label>
            <a href="/dashboard">
                <img id="profile-icon" src="/favicon-logo.ico" alt="Your Profile Icon"
                     style="max-height: 40px; max-width: 40px;">
            </a>
        </div>
    </div>
</header>

<main class="article-container">
    <span class="post-tag" th:text="${blog.tag}">Категория</span>

    <h1 class="post-title" th:text="${blog.title}">Заглавието на поста</h1>

    <div class="post-meta">
        от  <a id="author-profile" href="/user/" style="text-decoration: none">
        <span class="post-author" id="post-author" th:text="${blog.creator}">Автор</span>
            </a>
        <span class="meta-divider">•</span>
        <span id="post-date" class="post-date" th:data-date="${blog.creationDate}">
        </span>
    </div>

    <div id="admin-controls" style="display: none; margin-bottom: 20px;">
        <button onclick="editPost()" class="btn-edit">✎ Редактирай</button>
        <button onclick="deletePost()" class="btn-delete">🗑 Изтрий</button>
    </div>

    <p class="post-excerpt" th:text="${blog.excerpt}">Това е кратко описание на
        съдържанието, целящо да грабне вниманието на читателя</p>
    <hr>

    <article id="post" class="content"></article>

</main>

<script>
    async function loadPost(id) {
        const res = await fetch(`/api/blog/${id}`);
        const markdown = await res.text();

        marked.setOptions({
            highlight: function (code, lang) {
                return hljs.highlightAuto(code).value;
            }
        });

        const rawHtml = marked.parse(markdown);

        const cleanHtml = DOMPurify.sanitize(rawHtml);

        document.getElementById("post").innerHTML = cleanHtml;
    }

    const pathParts = window.location.pathname.split("/");
    const postId = pathParts[pathParts.length - 1];

    async function canEdit() {
        const response = await fetch(`/api/blog/can-edit/${postId}`);

        if (response.ok) {
            document.getElementById("admin-controls").style.display = "block";
        }
    }

    async function deletePost() {
        if (!confirm("Сигурен ли си?")) return;

        try {
            const response = await fetch(`/api/blog/delete/${postId}`, {
                method: 'POST'
            });

            const result = await response.json();

            if (response.ok && result.status === "ok") {
                alert("Изтрито успешно!");
                window.location.href = "/home";
            } else {
                console.error("Сървърът отказа триене:", result);
                alert("Нямаш права или постът не съществува.");
            }
        } catch (err) {
            console.error("Fatal error:", err);
        }
    }

    function editPost() {
        window.location.href = `/api/blog/edit/${postId}`;
    }

    loadPost(postId);
    canEdit();

    function formatPostDate() {
        const dateElement = document.getElementById("post-date");
        const rawDate = dateElement.getAttribute("data-date");

        if (rawDate) {
            const date = new Date(rawDate);

            const formattedDate = date.toLocaleDateString('bg-BG', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            dateElement.innerText = formattedDate;
        }

        link();
    }

    function link() {
        const authorLink = document.getElementById("author-profile");
        const authorNameElement = document.getElementById("post-author");

        const username = authorNameElement.innerText;

        if (username) {
            authorLink.href = `/user/${username}`;
        }
    }

    formatPostDate();

    console.log(postId);

</script>

</body>
</html>

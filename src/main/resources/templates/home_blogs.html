<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Умения+</title>
    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/tags.css">
    <style>
        #search {
            width: 90%;
            max-width: var(--max-width-large);
            background-color: var(--bg-card);
            padding: 25px;
            margin: 20px auto;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            box-sizing: border-box;

            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        #search div.filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        #search label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        #search select, #search input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #search select:focus, #search input:focus {
            border-color: var(--primary-color);
        }

        #holder {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            width: 95%;
            max-width: var(--max-width-large);
            padding: 20px 0;
        }

        .blog-excerpt {
            flex-grow: 1;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .blog {
            display: flex;
            flex-direction: column;
            padding: 25px;
            gap: 12px;
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
        }

        .blog-excerpt {
            margin: 10px 0 20px 0;
            flex-grow: 1;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .blog-title {
            font-size: 1.5rem;
            color: var(--text-dark);
            background:
                    linear-gradient(rgba(0,0,0,0.05), rgba(0,0,0,0.05));
            padding: 8px 16px;
            border-radius: var(--radius-lg);

            word-wrap: break-word;
            overflow-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.1;
            height: 3.4rem;
        }

        .blog-footer {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .read-more {
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 2px dashed #ddd;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            display: block;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .hidden-pagination {
            display: none !important;
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <a href="/" class="logo">Умения+</a>
        <div class="header-actions">
            <button id="toggle-search-btn" class="btn-create"
                    style="background-color: var(--text-light); margin-right: 10px;">
                🔍 Филтри
            </button>
            <a href="/create" class="btn-create">+ Създай Пост</a>
        </div>
        <div class="userInformation" style="display: flex">
            <label for="profile-icon" id="username" style="margin: 10px">
                Не сте вписани
            </label>
            <a href="/dashboard">
                <img id="profile-icon" src="/favicon-logo.ico" alt="Your Profile Icon"
                     style="max-height: 40px; max-width: 40px;">
            </a>
        </div>
    </div>
</header>

<div id="search" class="search">
    <div class="filter-group">
        <label for="category">Категория</label>
        <select id="category" name="category"></select>
    </div>

    <div class="filter-group">
        <label for="order-by">Подреди по</label>
        <select id="order-by" name="order-by">
            <option value="normal">По подразбиране</option>
            <option value="oldest-first">Най-стари първо</option>
            <option value="newest-first">Най-нови първо</option>
        </select>
    </div>

    <div class="filter-group">
        <label for="blog-name">Име</label>
        <input type="text" id="blog-name" placeholder="Търси по име...">
    </div>

    <div class="button-group">
        <button id="show" class="fancy-button">Потърси</button>
        <button id="clear" class="fancy-button outline">Изчисти</button>
    </div>
</div>

<div id="pagination-top" class="pagination-wrapper"></div>

<div id="holder"></div>

<div id="pagination-bottom" class="pagination-wrapper"></div>

<script>
    let currentPage = 0;

    const searchSection = document.getElementById("search");
    const toggleBtn = document.getElementById("toggle-search-btn");

    searchSection.classList.add("hidden");


    toggleBtn.addEventListener("click", function () {
        const isHidden = searchSection.classList.toggle("hidden");
        this.style.backgroundColor = !isHidden ? "var(--primary-color)" : "var(--text-light)";
    });

    document.getElementById("show").addEventListener("click", function () {
        currentPage = 0;
        triggerFetch();
    });

    document.getElementById("clear").addEventListener("click", clearFilter);

    function clearFilter(){
        const category_select = document.getElementById("category");
        category_select.selectedIndex = category_select.options.length - 1;
        document.getElementById("blog-name").value = '';
        currentPage = 0;
        triggerFetch();
    }


    async function loadCategories() {
        try {
            const response = await fetch("/api/blog/tags");
            if (!response.ok) throw new Error("Failed to fetch tags");
            const tags = await response.json();
            const select = document.getElementById("category");
            select.innerHTML = "";

            Object.entries(tags).forEach(([key, value]) => {
                const option = document.createElement("option");
                option.value = key;
                option.textContent = key;
                select.appendChild(option);
            });

            select.selectedIndex = select.options.length - 1;
        } catch (err) {
            console.error("Error loading categories:", err);
        }
    }

    function triggerFetch() {
        const category = document.getElementById("category").value;
        const name = document.getElementById("blog-name").value;
        const orderBy = document.getElementById("order-by").value;

        const parameters = new URLSearchParams({
            name: name,
            category: category,
            order: orderBy,
            page: currentPage
        });
        loadStuff(`/api/blog/get-filtered-view/?${parameters.toString()}`);
    }

    async function loadStuff(url) {
        try {
            const response = await fetch(url);
            const holder = document.getElementById("holder");
            const data = await response.json();

            if (data && data.length > 0) {
                holder.innerHTML = data.map(element => `
                <div class="blog ${element.tag.toString().toLowerCase().replace(" ", "-")}" onclick="window.location.href='/blog/${element.id}'">
                    <div class="blog-header">
                        <span class="blog-tag">${element.tag}</span>
                        <h2 class="blog-title">${element.title}</h2>
                    </div>

                    <p class="post-meta" style="margin: 0; font-size: 0.85rem;">
                        от <strong>${element.creator}</strong> •
                        <span>${new Date(element.creationDate).toLocaleDateString('bg-BG')}</span>
                    </p>

                    <p class="blog-excerpt">${element.excerpt || ''}</p>

                    <div class="blog-footer">
                        <span class="read-more">Прочети повече →</span>
                    </div>
                </div>
            `).join('');

                togglePaginationVisibility(true);
                renderPagination(data.length);
            } else {
                holder.innerHTML = "";
                checkEmpty();
            }
        } catch (err) {
            console.error("Failed to load blogs:", err);
            holder.innerHTML = "<p style='text-align:center;'>Възникна грешка при зареждането.</p>";
        }
    }

    function togglePaginationVisibility(show) {
        const paginations = [
            document.getElementById("pagination-top"),
            document.getElementById("pagination-bottom")
        ];

        paginations.forEach(p => {
            if (p) {
                if (show) p.classList.remove("hidden-pagination");
                else p.classList.add("hidden-pagination");
            }
        });
    }

    function checkEmpty() {
        const holder = document.getElementById("holder");

        if (holder.innerHTML.trim() === "") {
            holder.innerHTML = `
            <div class="empty-state">
                <span class="empty-state-icon">🔍</span>
                <h3>Опа! Нищо не открихме.</h3>
                <p>Изглежда, че няма публикации, отговарящи на вашите критерии. Опитайте да промените филтрите или потърсете нещо друго.</p>
                <button id="clear" onclick="clearFilter()" class="fancy-button outline" style="margin-top: 10px">Изчисти филтрите</button>
            </div>
        `;
            togglePaginationVisibility(false);
        }
    }

    function renderPagination(itemsCount) {
        const containers = [
            document.getElementById("pagination-top"),
            document.getElementById("pagination-bottom")
        ];

        containers.forEach(container => {
            if (!container) return;
            container.innerHTML = "";

            const prevBtn = document.createElement("button");
            prevBtn.textContent = "← Назад";
            prevBtn.classList.add("nav-btn");
            prevBtn.disabled = currentPage === 0;
            prevBtn.onclick = () => {
                currentPage--;
                triggerFetch();
                window.scrollTo({top: 0, behavior: 'smooth'});
            };

            const indicator = document.createElement("span");
            indicator.textContent = `Страница ${currentPage + 1}`;
            indicator.classList.add("current-page-display");

            const nextBtn = document.createElement("button");
            nextBtn.textContent = "Напред →";
            nextBtn.classList.add("nav-btn");
            nextBtn.disabled = itemsCount < 15;
            nextBtn.onclick = () => {
                currentPage++;
                triggerFetch();
                window.scrollTo({top: 0, behavior: 'smooth'});
            };

            container.append(prevBtn, indicator, nextBtn);
        });
    }

    async function loadUserInformation() {
        const username = document.getElementById("username");
        const response = await fetch("/api/user/me-info");
        const userInformation = await response.json();
        username.innerText = userInformation.username;

        const profileIcon = document.getElementById("profile-icon");
        profileIcon.src = "/api/profile-icon/" + userInformation.icon;
    }

    loadUserInformation();

    //init
    loadCategories(); //0
    loadStuff("/api/blog/get-filtered-view/?page=0");
</script>
</body>
</html>

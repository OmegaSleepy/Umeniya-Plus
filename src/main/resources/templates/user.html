<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профил | Умения+</title>

    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/tags.css">
    <link rel="stylesheet" href="/api/style/explorer.css">
    <script src="/api/js/loadUserInfo.js" defer></script>
    <script src="/api/js/applyTheme.js" defer></script>

</head>
<body>
<header>
    <div class="header-container" id="header-container">
        <a href="/" class="logo">Умения+</a>
        <div class="header-actions">
            <a href="/create" class="btn-create">+ Сподели опит</a>
        </div>
    </div>
</header>

<main id="profile-container" style="width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px;">

    <div class="article-container" style="margin: 30px auto; text-align: center; width: 90%; max-width: var(--max-width-large);">
        <img id="that-profile-icon" src="" alt="User Icon"
             style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-color); background: #f0f0f0; margin-bottom: 15px; box-shadow: var(--shadow-md);">
        <h1 id="user-display-name" style="margin: 0; color: var(--text-dark); font-size: 2rem;">Зареждане...</h1>
        <div style="display: flex; gap: 20px; margin-top: 20px; justify-content: center; width: 100%;">
            <div style="background: var(--bg-body); padding: 15px; border-radius: var(--radius-md); flex: 1; max-width: 200px;">
                <span style="display: block; font-size: 1.5rem; font-weight: bold; color: var(--primary-color);"
                      id="stat-count">0</span>
                <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Публикации</span>
            </div>
            <div style="background: var(--bg-body); padding: 15px; border-radius: var(--radius-md); flex: 1; max-width: 200px;">
                <span style="display: block; font-size: 1.5rem; font-weight: bold; color: var(--primary-color);"
                      id="stat-views">0</span>
                <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Помогнати души</span>
            </div>
            <div style="background: var(--bg-body); padding: 15px; border-radius: var(--radius-md); flex: 1; max-width: 200px;">
                <span style="display: block; font-size: 1.5rem; font-weight: bold; color: var(--primary-color);"
                      id="stat-likes">0</span>
                <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Харесвания</span>
            </div>
        </div>
    </div>

    <div id="pagination-top" class="pagination-wrapper hidden-pagination"></div>

    <div id="holder">
    </div>

    <div id="pagination-bottom" class="pagination-wrapper hidden-pagination"></div>
</main>

<script>

    const urlSegments = window.location.pathname.split("/").filter(Boolean);
    const username = urlSegments.pop();

    async function init() {
        if (!username) return;

        document.title = `${username} - Умения+`;
        document.getElementById("user-display-name").textContent = username;


        try {
            const userRes = await fetch(`/api/user/${username}`);
            if (userRes.ok) {
                const userData = await userRes.json();
                document.getElementById("that-profile-icon").src = `/api/profile-icon/${userData.icon}`;
            }
        } catch (e) { console.error("Could not load user profile", e); }

        await loadPosts();
        await loadViews();
        await loadLikes();
    }

    async function loadPosts() {
        const holder = document.getElementById("holder");
        try {
            const response = await fetch(`/api/blog/by-author/${username}`);
            if (!response.ok) throw new Error("API error");

            const data = await response.json();

            if (data && data.length > 0) {
                renderCards(data);
                document.getElementById("stat-count").textContent = data.length;
            } else {
                showEmpty();
            }

        } catch (err) {
            console.log(err);
            holder.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Грешка при свързването със сървъра.</p>";
        }
    }

    async function loadViews() {
        const response = await fetch(`/api/user/total-views/${username}`);
        document.getElementById("stat-views").textContent = await response.json();
    }
    async function loadLikes() {
        const response = await fetch(`/api/user/total-likes/${username}`);
        document.getElementById("stat-likes").textContent = await response.json();
    }

    function renderCards(posts) {
        const holder = document.getElementById("holder");

        holder.innerHTML = posts.map(element => `
                    <div class="blog ${element.tag.toString().toLowerCase().replace(" ", "-")}" onclick="window.location.href='/blog/${element.id}'">
                        <div class="blog-header">
                            <span class="blog-tag">${element.tag}</span>
                            <h2 class="blog-title">${element.title}</h2>
                        </div>

                        <div class="blog-stats">
                            <span>👁️ ${element.views || 0}</span>
                            <span>💚${element.likes || 0}</span>
                        </div>

                        <p class="post-meta" style="margin: 0; font-size: 0.85rem;">
                            от <strong>${element.creator}</strong> •
                            <span>${new Date(element.creationDate).toLocaleDateString('bg-BG')}</span>
                        </p>

                        <p class="blog-excerpt">${element.excerpt || ''}</p>

                        <div class="blog-footer">
                            <span class="read-more">Прочети повече →</span>
                        </div>
                    </div>
                `).join('');
    }

    function showEmpty() {
        document.getElementById("holder").innerHTML = `
            <div class="empty-state">
                <span class="empty-state-icon">📝</span>
                <h3>Все още няма опит.</h3>
                <p>Този потребител все още не е публикувал нищо в платформата.</p>
            </div>
        `;
        document.getElementById("user-stats").textContent = "0 публикации";
    }

    init();
</script>
</body>
</html>

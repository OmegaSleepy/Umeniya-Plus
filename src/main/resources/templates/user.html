<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/tags.css">
    <link rel="stylesheet" href="/api/style/explorer.css">
    <script src="/api/js/loadUserInfo.js" defer></script>
</head>
<body>
<header>
    <div class="header-container" id="header-container">
        <a href="/" class="logo">Умения+</a>
        <div class="header-actions">
            <a href="/create" class="btn-create">+ Сподели опит</a>
        </div>
    </div>
</header>

<img id="that-profile-icon" src="" alt="User Icon">

<script>
    async function s() {
        const url = window.location.href;
        const username = url.split("/").filter(Boolean).pop();

        document.title = username;

        const response = fetch(`/api/user/${username}`, {
            method: "GET"
        });

        if (!response.ok) {
            return;
        }

        const json = await response.json();
        const profileIcon = document.getElementById("that-profile-icon");

        profileIcon.src = "/api/profile-icon/" + json.icon;
    }
    s();
</script>
</body>
</html>

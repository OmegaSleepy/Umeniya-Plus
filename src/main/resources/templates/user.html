<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профил | Умения+</title>
    <script src="/api/js/applyTheme.js" defer></script>

    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/tags.css">
    <link rel="stylesheet" href="/api/style/explorer.css">
    <script src="/api/js/loadUserInfo.js" defer></script>
</head>
<body>
<header>
    <div class="header-container" id="header-container">
        <a href="/" class="logo">Умения+</a>
        <div class="header-actions">
            <a href="/create" class="btn-create">+ Сподели опит</a>
        </div>
    </div>
</header>

<main id="profile-container" style="width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px;">

    <div class="article-container" style="margin: 30px auto; text-align: center; width: 90%; max-width: var(--max-width-large);">
        <img id="that-profile-icon" src="" alt="User Icon"
             style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-color); background: #f0f0f0; margin-bottom: 15px; box-shadow: var(--shadow-md);">
        <h1 id="user-display-name" style="margin: 0; color: var(--text-dark); font-size: 2rem;">Зареждане...</h1>
        <p id="user-stats" style="color: var(--text-muted); font-weight: 500; margin-top: 8px;"></p>
    </div>

    <div id="pagination-top" class="pagination-wrapper hidden-pagination"></div>

    <div id="holder">
    </div>

    <div id="pagination-bottom" class="pagination-wrapper hidden-pagination"></div>
</main>

<script>

    const urlSegments = window.location.pathname.split("/").filter(Boolean);
    const username = urlSegments.pop();

    async function init() {
        if (!username) return;

        document.title = `${username} - Умения+`;
        document.getElementById("user-display-name").textContent = username;


        try {
            const userRes = await fetch(`/api/user/${username}`);
            if (userRes.ok) {
                const userData = await userRes.json();
                document.getElementById("that-profile-icon").src = `/api/profile-icon/${userData.icon}`;
            }
        } catch (e) { console.error("Could not load user profile", e); }

        loadPosts();
    }

    async function loadPosts() {
        const holder = document.getElementById("holder");
        try {
            const response = await fetch(`/api/blog/by-author/${username}`);
            if (!response.ok) throw new Error("API error");

            const data = await response.json();

            if (data && data.length > 0) {
                renderCards(data);
                document.getElementById("user-stats").textContent = `${data.length} споделени умения`;
            } else {
                showEmpty();
            }
        } catch (err) {
            console.log(err);
            holder.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Грешка при свързването със сървъра.</p>";
        }
    }

    function renderCards(posts) {
        const holder = document.getElementById("holder");
        holder.innerHTML = posts.map(item => {

            const tagSlug = item.tag ? item.tag.toString().toLowerCase().replace(/\s+/g, "-") : "няма";

            return `
            <div class="blog ${tagSlug}" onclick="window.location.href='/blog/${item.id}'" style="cursor: pointer;">
                <div class="blog-header">
                    <span class="blog-tag ${tagSlug}">${item.tag}</span>
                    <h2 class="blog-title">${item.title}</h2>
                </div>

                <p class="post-meta" style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">
                    <span>${new Date(item.creationDate).toLocaleDateString('bg-BG')}</span>
                </p>

                <p class="blog-excerpt">${item.excerpt || 'Кликнете, за да прочетете повече.'}</p>

                <div class="blog-footer">
                    <span class="read-more">Прочети повече →</span>
                </div>
            </div>
        `;
        }).join('');
    }

    function showEmpty() {
        document.getElementById("holder").innerHTML = `
            <div class="empty-state">
                <span class="empty-state-icon">📝</span>
                <h3>Все още няма опит.</h3>
                <p>Този потребител все още не е публикувал нищо в платформата.</p>
            </div>
        `;
        document.getElementById("user-stats").textContent = "0 публикации";
    }

    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирай Пост | Умения+</title>
    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/content.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">
    <script src="/api/js/loadUserInfo.js" defer></script>
</head>

<body>

<header>
    <div class="header-container" id="header-container">
        <a href="/" class="logo">Умения+</a>
        <div class="header-actions">
            <a href="/home" class="btn-create">Отказ</a>
        </div>
    </div>
</header>

<div class="editor-wrapper" id="mainWrapper">
    <div class="form-container" id="formSide">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Редактирай Пост</h2>
            <button type="button" id="togglePreview" class="btn-toggle">Предварителен Преглед</button>
        </div>

        <form id="editBlogForm">
            <div class="form-group">
                <label for="title">Заглавие</label>
                <input type="text" id="title" name="title" placeholder="Заглавие..." required>
            </div>

            <div class="form-group">
                <label for="category">Категория</label>
                <select id="category" name="category"></select>
            </div>

            <div class="form-group">
                <label for="excerpt">Кратко описание</label>
                <input type="text" id="excerpt" name="excerpt" placeholder="Кратко описание...">
            </div>

            <div class="form-group">
                <label for="content">Съдържание <a href="/help/markdown-info">(Markdown)</a></label>
                <textarea id="content" name="content" placeholder="Съдържание..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Запази Промените</button>
        </form>
    </div>

    <div id="preview-panel" class="article-container" style="margin-top: 0; display: none;">
        <span class="post-tag" id="preview-tag">Категория</span>
        <h1 class="post-title" id="preview-title"></h1>
        <div class="post-excerpt" id="preview-excerpt"></div>
        <hr>
        <div id="markdown-body" class="post-content"></div>
    </div>
</div>

<script>
    const contentInput = document.getElementById('content');
    const titleInput = document.getElementById('title');
    const excerptInput = document.getElementById('excerpt');
    const categoryInput = document.getElementById('category');
    const previewPanel = document.getElementById('preview-panel');
    const toggleBtn = document.getElementById('togglePreview');
    const blogForm = document.getElementById('editBlogForm');

    // 1. Extract ID from URL (/edit/123 -> 123)
    const pathParts = window.location.pathname.split('/');
    const blogId = pathParts[pathParts.length - 1];

    function updatePreview() {
        document.getElementById('preview-title').textContent = titleInput.value || "Преглед на заглавието";
        document.getElementById('preview-excerpt').textContent = excerptInput.value || "Краткото описание ще се появи тук...";

        // Handle Category Tag Styling
        const tag = document.getElementById('preview-tag');
        tag.textContent = categoryInput.value || "Категория";
        tag.className = 'post-tag ' + (categoryInput.value || '').toLowerCase().replace(/\s+/g, '-');

        const rawValue = contentInput.value;
        document.getElementById('markdown-body').innerHTML = marked.parse(rawValue);
    }

    toggleBtn.addEventListener('click', () => {
        previewPanel.classList.toggle('active');
        const isShowing = previewPanel.classList.contains('active');
        previewPanel.style.display = isShowing ? 'block' : 'none';
        if (isShowing) updatePreview();
    });

    [contentInput, titleInput, excerptInput, categoryInput].forEach(el => {
        el.addEventListener('input', updatePreview);
    });

    async function loadInitialData() {
        try {
            // Load Categories first
            const catRes = await fetch("/api/blog/tags");
            const tags = await catRes.json();
            categoryInput.innerHTML = "";
            Object.entries(tags).forEach(([key, value]) => {
                const option = document.createElement("option");
                option.value = key;
                option.textContent = key;
                categoryInput.appendChild(option);
            });

            // Fetch existing blog data
            const blogRes = await fetch(`/api/blog/full/${blogId}`);
            if (!blogRes.ok) throw new Error("Blog post not found");
            const blog = await blogRes.json();

            // Populate form
            titleInput.value = blog.title;
            excerptInput.value = blog.excerpt;
            categoryInput.value = blog.category;
            contentInput.value = blog.content;

            updatePreview();
        } catch (err) {
            console.error("Error loading blog:", err);
            alert("Грешка при зареждане на поста.");
        }
    }

    blogForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const data = {
            title: titleInput.value,
            category: categoryInput.value,
            excerpt: excerptInput.value,
            content: contentInput.value
        };

        try {
            // Note: Replace with your actual update endpoint
            const response = await fetch(`/api/blog/update/${blogId}`, {
                method: "PUT", // or POST depending on your backend
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });

            if (!response.ok) throw new Error("Update failed");

            alert("Постът е обновен успешно!");
            window.location.href = `/blog/${blogId}`; // Redirect to view the post
        } catch (err) {
            console.error("Error updating blog post:", err);
            alert("Грешка при запис на промените.");
        }
    });

    loadInitialData();
</script>
</body>
</html>

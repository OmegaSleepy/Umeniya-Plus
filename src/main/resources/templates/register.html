<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Създай профил</title>
    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>
<div id="log-in-box" class="auth-container">
    <h2>Регистрация</h2>
    <div class="form-group">
        <label for="username">Потребителско име</label>
        <input id="username" name="username" type="text" placeholder="Въведете име..." required>
    </div>

    <div class="form-group">
        <label for="password">Парола</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required>
    </div>

    <div class="form-group">
        <label for="confirm-password">Потвърдете парола</label>
        <input id="confirm-password" name="confirm-password" type="password" placeholder="••••••••" required>
    </div>


    <div class="form-group show-password-container">
        <input type="checkbox" id="show-pass" onclick="showPassword()">
        <label for="show-pass">Покажи Парола</label>
    </div>

    <span id="message" style="margin: 0"></span>
    <button id="send-info" type="submit" class="fancy-button">Впиши се</button>

    <div class="auth-footer">
        Имете профил? <a href="/login">Впиши се</a>
    </div>
</div>

<script>
    function showPassword() {
        const password_field = document.getElementById("password");
        const confirm_password_field = document.getElementById("confirm-password");
        const type = password_field.type === "password" ? "text" : "password";
        password_field.type = type;
        confirm_password_field.type = type;
    }

    const MIN_ALPHANUMERICAL = 6;
    const MIN_SPECIAL = 1;
    const MIN_NUMBER = 2;
    const MIN_LENGTH = 12;

    function validatePassword(password) {
        if (!password || password.length < MIN_LENGTH) {
            return `Паролата трябва да е поне ${MIN_LENGTH} символа.`;
        }

        let letters = 0;
        let digits = 0;
        let specials = 0;

        for (const char of password) {
            if (/[a-zA-Z]/.test(char)) {
                letters++;
            } else if (/[0-9]/.test(char)) {
                digits++;
            } else {
                specials++;
            }
        }

        if (letters < MIN_ALPHANUMERICAL) return `Трябват поне ${MIN_ALPHANUMERICAL} букви.`;
        if (digits < MIN_NUMBER) return `Трябват поне ${MIN_NUMBER} цифри.`;
        if (specials < MIN_SPECIAL) return `Трябва поне ${MIN_SPECIAL} специален символ.`;

        return null;
    }

    document.getElementById("send-info").addEventListener("click", async function () {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const password2 = document.getElementById("confirm-password").value;
        const message = document.getElementById("message");

        if (password !== password2) {
            Swal.fire({
                icon: 'warning',
                title: 'Паролите не съвпадат!',
                confirmButtonColor: '#3085d6'
            });
            return;
        }

        const error = validatePassword(password);
        if (error) {
            message.style.color = "red";
            message.innerHTML = error;
            return;
        }

        const data = { username, password };
        try {
            const response = await fetch("/auth/credentials/sign-up", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                credentials: "include",
                body: JSON.stringify(data)
            });

            if (response.ok) {
                window.location.href = "/home";
            } else {
                const body = await response.json();
                message.style.color = "red";
                message.innerHTML = body.error || "Възникна грешка";
            }
        } catch (e) {
            message.innerHTML = "Грешка при свързване със сървъра.";
        }
    });

    function reset() {
        document.getElementById("show-pass").checked = false;
    }

    reset();
</script>

</body>
</html>

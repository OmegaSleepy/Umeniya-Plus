<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моето Табло | Умения+</title>
    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/tags.css">
    <link rel="stylesheet" href="/api/style/explorer.css">
    <link rel="stylesheet" href="/api/style/buttons.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="/api/js/loadUserInfo.js" defer></script>
    <script src="/api/js/applyTheme.js" defer></script>
</head>
<body>
<header>
    <div class="header-container" id="header-container">
        <a href="/" class="logo">Умения+</a>
        <div class="header-actions">
            <a href="/create" class="btn-create">+ Ново Умение</a>
            <a href="/logout" class="btn-back" style="margin-left: 15px;">Изход</a>
        </div>
    </div>
</header>

<main id="dashboard-container"
      style="width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px;">

    <div class="article-container"
         style="margin: 30px auto; text-align: center; width: 90%; max-width: var(--max-width-large); display: flex; flex-direction: column; align-items: center;">
        <img id="my-profile-icon" src="" alt="Profile"
             style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-color); background: #f0f0f0; margin-bottom: 15px;">

        <h1 style="margin: 0; color: var(--text-dark);">Здравей, <span id="welcome-name">...</span>!</h1>
        <p style="color: var(--text-muted); margin-top: 5px;">Добре дошъл в личното си табло за управление.</p>

        <div style="display: flex; gap: 20px; margin-top: 20px; justify-content: center; width: 100%;">
            <div style="background: var(--bg-body); padding: 15px; border-radius: var(--radius-md); flex: 1; max-width: 200px;">
                <span style="display: block; font-size: 1.5rem; font-weight: bold; color: var(--primary-color);"
                      id="stat-count">0</span>
                <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Публикации</span>
            </div>
            <div style="background: var(--bg-body); padding: 15px; border-radius: var(--radius-md); flex: 1; max-width: 200px;">
                <span style="display: block; font-size: 1.5rem; font-weight: bold; color: var(--primary-color);"
                      id="stat-views">0</span>
                <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Помогнати души</span>
            </div>
            <div style="background: var(--bg-body); padding: 15px; border-radius: var(--radius-md); flex: 1; max-width: 200px;">
                <span style="display: block; font-size: 1.5rem; font-weight: bold; color: var(--primary-color);"
                      id="stat-likes">0</span>
                <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Харесвания</span>
            </div>
        </div>

        <a class="btn-create" href="/my-likes" style="margin-top: 1rem">Моите Харесвания</a>

    </div>

    <div class="header-container" style="margin-top: 20px;">
        <h2 style="color: var(--text-dark); border-left: 5px solid var(--primary-color); padding-left: 15px;">Твоите
            споделени умения</h2>
    </div>

    <div id="holder">
    </div>

</main>


<script>
    document.addEventListener("DOMContentLoaded", initDashboard);

    let someSecondsPassed = false;

    setTimeout(() => {
        someSecondsPassed = true;
        initDashboard();
    }, 200);

    async function initDashboard() {
        try {
            const username = await getUsername();

            setupDashboardUI(username);
            loadMyPosts(username);

        } catch (err) {
            console.error("Auth error:", err);
            window.location.href = "/login";
        }
    }

    function setupDashboardUI(username) {
        document.title = `Табло: ${username} - Умения+`;
        const welcomeName = document.getElementById("welcome-name");
        if (welcomeName) welcomeName.textContent = username;
        const profileIcon = document.getElementById("my-profile-icon");
        profileIcon.src = getProfileIcon();
    }

    async function loadMyPosts(username) {
        const holder = document.getElementById("holder");
        const statCount = document.getElementById("stat-count");
        const statViews = document.getElementById("stat-views");
        const statLikes = document.getElementById("stat-likes");

        try {
            const res = await fetch(`/api/blog/by-author/${username}`);
            if (!res.ok) throw new Error();

            const posts = await res.json();

            statCount.textContent = posts?.length || 0;

            const response = await fetch(`/api/user/total-views/${username}`);
            const data = await response.json();

            const response1 = await fetch(`/api/user/total-likes/${username}`);
            statLikes.textContent = await response1.json();

            statViews.textContent = `${data}`;

            if (posts?.length) {
                renderDashboardCards(posts);
            } else {
                showEmptyDashboard();
            }


        } catch(err) {
            console.error(err);
            holder.innerHTML =
                "<p style='grid-column: 1/-1; text-align:center;'>Грешка при зареждане на данните.</p>";
        }
    }

    function renderDashboardCards(posts) {
        const holder = document.getElementById("holder");

        holder.innerHTML = posts.map(element => `
            <div class="blog ${element.tag.toString().toLowerCase().replace(" ", "-")}">
                <div class="blog-header">
                    <span class="blog-tag">${element.tag}</span>
                    <h2 class="blog-title">${element.title}</h2>
                </div>

                <div class="blog-stats">
                    <span>👁️ ${element.views || 0}</span>
                    <span>💚${element.likes || 0}</span>
                </div>

                <p class="post-meta" style="margin: 0; font-size: 0.85rem;">
                    от <strong>${element.creator}</strong> •
                    <span>${new Date(element.creationDate).toLocaleDateString('bg-BG')}</span>
                </p>

                <p class="blog-excerpt">${element.excerpt || ''}</p>

                <div class="blog-footer">
                    <button class="btn-some-fancy"
                        onclick="location.href='/blog/${element.id}'">
                        Прочети
                    </button>

                    <button class="btn-edit"
                        onclick="location.href='/edit/${element.id}'">
                        Редактирай
                    </button>

                    <button class="btn-delete"
                        onclick="deletePost('${element.id}')">
                        Изтрий
                    </button>
                </div>
            </div>
        `).join('');
    }

    function showEmptyDashboard() {
        document.getElementById("holder").innerHTML = `
        <div class="empty-state">
            <span>📝</span>
            <h3>Все още нямаш споделени умения.</h3>
            <p>Твоето табло е празно. Сподели първия си опит сега!</p>
            <a href="/create" class="btn-create" style="margin-top: 1rem;">
                + Сподели опит
            </a>
        </div>
    `;
    }

    async function deletePost(id) {
        const result = await Swal.fire({
            title: 'Сигурен ли си?',
            text: "Няма да можеш да възстановиш публикацията!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Да, изтрий!',
            cancelButtonText: 'Отказ'
        });

        if (!result.isConfirmed) return;

        try {
            const response = await fetch(`/api/blog/${id}`, {
                method: 'DELETE'
            });

            const data = await response.json();

            if (response.ok && data.status === "ok") {
                await Swal.fire({
                    icon: 'success',
                    title: 'Успешно!',
                    text: 'Публикацията е изтрита!',
                    confirmButtonColor: '#3085d6'
                });

                location.reload();
            } else {
                throw new Error(data.message || "Server rejected deletion");
            }
        } catch (err) {
            console.error("Delete error:", err);
            Swal.fire({
                icon: 'error',
                title: 'Грешка!',
                text: 'Нещо се обърка при връзката със сървъра.',
                confirmButtonColor: '#3085d6'
            });
        }
    }
</script>

<div id="icon-modal"
     style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 25px; border-radius: var(--radius-md); max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative;">
        <h3 style="margin-top: 0; color: var(--text-dark); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px;">
            Избери нова икона</h3>
        <button onclick="closeModal()"
                style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 1.5rem; cursor: pointer;">
            &times;
        </button>

        <div id="icon-grid"
             style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; margin-top: 20px;">
        </div>
    </div>
</div>

<style>
    #my-profile-icon {
        transition: transform 0.2s, filter 0.2s;
        cursor: pointer;
    }

    #my-profile-icon:hover {
        transform: scale(1.05);
        filter: brightness(0.9);
    }

    .selectable-icon {
        width: 100%;
        aspect-ratio: 1/1;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: border-color 0.2s;
        object-fit: cover;
    }

    .selectable-icon:hover {
        border-color: var(--primary-color);
    }
</style>

<script>

    document.getElementById("my-profile-icon").addEventListener("click", openIconModal);

    async function openIconModal() {
        const modal = document.getElementById("icon-modal");
        const grid = document.getElementById("icon-grid");

        grid.innerHTML = "Зареждане...";
        modal.style.display = "flex";

        try {
            const response = await fetch("/api/icons");
            const icons = await response.json();

            grid.innerHTML = icons.map(iconName => `
            <img src="/api/profile-icon/${iconName}"
                 class="selectable-icon"
                 onclick="updateProfilePicture('${iconName}')"
                 alt="${iconName}">
        `).join("");

        } catch (err) {
            grid.innerHTML = "Грешка при зареждане на иконите.";
            console.error(err);
        }
    }

    async function updateProfilePicture(iconName) {
        try {
            const response = await fetch(`/api/user/change-pfp/${iconName}`, {
                method: 'GET'
            });

            if (response.ok) {
                document.getElementById("my-profile-icon").src = `/api/profile-icon/${iconName}`;
                closeModal();
                setProfileIcon(document.getElementById("my-profile-icon").src);
            } else {
                Swal.fire({
                    icon: 'warning',
                    title: 'Грешка!',
                    text: 'Случи се случка, опитай отново!',
                    confirmButtonColor: '#3085d6'
                });
            }
        } catch (err) {
            console.error("Update failed:", err);
        }
    }

    function closeModal() {
        document.getElementById("icon-modal").style.display = "none";
    }

    window.onclick = function (event) {
        const modal = document.getElementById("icon-modal");
        if (event.target == modal) {
            closeModal();
        }
    }
</script>

<footer id="post-footer" style="margin-top: 50px; padding: 40px; text-align: center; color: var(--text-light); border-top: 1px solid var(--border-color);">
    <p> Умения+ за НОИТ 2026г.</p>
</footer>

</body>
</html>

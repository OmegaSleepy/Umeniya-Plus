<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страницата не е намерена | Умения+</title>
    <link rel="stylesheet" href="/api/style">
    <style>
        .error-container {
            text-align: center;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
            line-height: 1;
            text-shadow: 2px 4px var(--tag-bg);
        }

        .error-message {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 30px;
        }

        .error-description {
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .illustration {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<header>
    <div class="header-container">
        <a href="/" class="logo">Умения+</a>
        <a href="/home" class="btn-create">Начална Страница</a>
        <div class="userInformation" style="display: flex">
            <label for="profile-icon" id="username" style="margin: 10px">
                Не сте вписани
            </label>
            <a href="/dashboard">
                <img id="profile-icon" src="/favicon-logo.ico" alt="Your Profile Icon"
                     style="max-height: 40px; max-width: 40px;">
            </a>
        </div>
    </div>
</header>

<main id="holder">
    <div class="article-container error-container">
        <div class="illustration">🔍</div>
        <h1 class="error-code">404</h1>
        <p class="error-message">Опалянка! Страницата не съществува?!</p>
        <hr>
        <p class="error-description">
            Както изглежда, нещо се обърка...
            Прегледайте страницата, която се опитахте да отворите и опитайте отново.
        </p>
        <hr>

        <div style="display: flex; gap: 15px;">
            <a href="javascript:history.back()" class="btn-back">
                ← Назад
            </a>
            <a href="/home" class="btn-create">Към Началото</a>
        </div>
    </div>
</main>

<script>
    async function loadUserInformation() {
        const username = document.getElementById("username");
        const response = await fetch("/api/user/me-info");
        const userInformation = await response.json();
        username.innerText = userInformation.username;

        const profileIcon = document.getElementById("profile-icon");
        profileIcon.src = "/api/profile-icon/" + userInformation.icon;
    }

    loadUserInformation();
</script>

</body>
</html>

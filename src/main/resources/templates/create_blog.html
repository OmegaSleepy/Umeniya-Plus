<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Създай нов пост в Умения+</title>

    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/content.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.min.js"></script>

    <script src="/api/js/loadUserInfo.js" defer></script>
    <script src="/api/js/applyTheme.js" defer></script>
    <script src="/api/js/editor.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<header>
    <div class="header-container" id="header-container">
        <a href="/" class="logo">Умения+</a>
        <a href="/home" class="btn-create">Разгледай Постове</a>
    </div>
</header>

<div class="editor-wrapper" id="mainWrapper">
    <div class="form-container" id="formSide">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Създай Нов Пост</h2>
            <button type="button" id="togglePreview" class="btn-toggle">Предварителен Преглед</button>
        </div>

        <form id="blogForm">
            <div class="form-group">
                <label for="title">Заглавие</label>
                <input type="text" id="title" name="title" placeholder="Въведи интригуващо заглавие..." required>
            </div>

            <div class="form-group">
                <label for="category">Категория</label>
                <select id="category" name="category">
                </select>
            </div>

            <div class="form-group">
                <label for="excerpt">Кратко описание</label>
                <input type="text" id="excerpt" name="excerpt" placeholder="Както и описание на съдържанието на публикацията">
            </div>

            <div class="form-group">


                <label for="content">Съдържание <a href="/help/markdown-info">(Markdown)</a></label>
                <textarea id="content" name="content" placeholder="Въведи тялото на твоята статия тук..."
                          required></textarea>
            </div>

            <button type="submit" class="btn-submit">Публикувай</button>
        </form>
    </div>

    <div id="preview-panel" class="article-container" style="margin-top: 0; display: none;">
        <span class="post-tag" id="preview-tag">Категория</span>
        <h1 class="post-title" id="preview-title">Преглед на заглавието</h1>
        <div class="post-excerpt" id="preview-excerpt">Краткото описание ще се появи тук...</div>
        <hr>
        <div id="markdown-body" class="post-content"></div>
    </div>
</div>
</body>


</html>

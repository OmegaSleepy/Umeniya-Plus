<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин - Умения+</title>

    <link rel="stylesheet" href="/api/style/main.css">
    <link rel="stylesheet" href="/api/style/tags.css">
    <link rel="stylesheet" href="/api/style/buttons.css">
    <script src="/api/js/loadUserInfo.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        #shop-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            width: 95%;
            max-width: var(--max-width-large);
            margin: 20px auto;
            padding: 20px 0;
        }

        .color-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            transition: background 0.2s;
        }

        .color-item:hover {
            background: rgba(0,0,0,0.02);
        }

        .color-item label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: capitalize;
        }

        input[type="color"] {
            border: 2px solid #ddd;
            width: 34px;
            height: 34px;
            cursor: pointer;
            background: none;
            border-radius: 4px;
            padding: 0;
        }

        .price-badge {
            background: #ff5100;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        #color-pickers-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 15px 0;
            border: 1px solid #eee;
            border-radius: var(--radius-sm);
        }
    </style>
</head>
<body>

<header>
    <div class="header-container" id="header-container">
        <a href="/" class="logo">Умения+</a>
        <div class="header-actions">
            <a href="/home" class="btn-create">Отказ</a>
        </div>
    </div>
</header>

<div id="shop-container">
    <div class="blog" id="theme-item">
        <div class="blog-stats">
            <span>🎨 Персонализация</span>
            <span class="price-badge">200 Искри</span>
        </div>
        <h2 class="blog-title" style="margin-top: 15px;">Създател на Теми</h2>
        <p class="blog-excerpt">
            Променете цветовете на платформата в реално време. Вашата нова тема ще бъде запазена в профила ви.
        </p>

        <div id="color-pickers-list">
            <p style="padding: 20px; text-align: center; color: var(--text-muted);">Зареждане на палитра...</p>
        </div>

        <div class="blog-footer">
            <button class="btn-edit" id="btn-buy-theme" style="width: 100%;">Плати 200 Искри</button>
        </div>
    </div>

    <div class="blog" style="opacity: 0.6; border: 2px dashed #ddd; background: transparent; justify-content: center; align-items: center;">
        <div style="text-align: center; color: var(--text-muted);">
            <p style="font-size: 2rem;">🔒</p>
            <p>Очаквайте скоро</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const pickerList = document.getElementById('color-pickers-list');
        const buyBtn = document.getElementById('btn-buy-theme');

        try {
            // Fetch the current variables object
            const response = await fetch('/api/variables-css/');
            const variables = await response.json();

            pickerList.innerHTML = '';

            // Iterate through the object keys (e.g., "primary-color")
            Object.keys(variables).forEach(key => {
                const div = document.createElement('div');
                div.className = 'color-item';

                const varName = key.startsWith('--') ? key : `--${key}`;
                const colorValue = variables[key];

                div.innerHTML = `
                    <label>${key.replace(/-/g, ' ')}</label>
                    <input type="color" data-var="${varName}" value="${colorValue}">
                `;

                // Live Preview Logic
                const input = div.querySelector('input');
                input.addEventListener('input', (e) => {
                    document.documentElement.style.setProperty(varName, e.target.value);
                });

                pickerList.appendChild(div);
            });
        } catch (error) {
            pickerList.innerHTML = '<p style="padding:10px; color:red;">Грешка при връзка със сървъра.</p>';
        }

        buyBtn.addEventListener('click', async () => {
            const izkri = getVisualFlames();

            if (izkri >= 200) {
                const themeData = {};
                document.querySelectorAll('#color-pickers-list input').forEach(input => {
                    const key = input.getAttribute('data-var').replace('--', '');
                    themeData[key] = input.value;
                });

                try {
                    const saveResponse = await fetch('/api/create-css/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(themeData)
                    });

                    if (saveResponse.ok) {
                        addVisualFlames(-200);

                        await Swal.fire({
                            title: 'Успех!',
                            text: 'Темата е закупена и запазена успешно!',
                            icon: 'success',
                            confirmButtonColor: '#ff4500',
                            background: '#fff',
                            confirmButtonText: 'Към началната страница'
                        });

                        window.location.href = '/home';
                    } else {
                        Swal.fire('Грешка', 'Възникна грешка при запазването.', 'error');
                    }
                } catch (err) {
                    console.error("Save error:", err);
                    Swal.fire('Ops!', 'Нещо се обърка със сървъра.', 'error');
                }

            } else {
                Swal.fire({
                    icon: 'warning',
                    title: 'Нямате достатъчно искри!',
                    text: 'Трябват ви поне 200 искри за тази тема.',
                    footer: '<a href="/help/iskri">Как да взема повече искри?</a>',
                    confirmButtonColor: '#3085d6'
                });
            }
        });
    });
</script>

</body>
</html>
